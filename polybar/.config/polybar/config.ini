; Archcraft i3wm Premium Theme 4 bar
; main bar (tray output) + aux bar (no tray), one per connected monitor
;
; Polybar notes (verified against 3.7.1 source):
;   - spacing values (padding/module-margin/label-padding) NEED a "px" suffix,
;     bare numbers are parsed as SPACES and rendered at font width!
;   - font indices in *-font keys and %{T<n>} tags are 1-based (1 = font-0,
;     context.hpp swaps fonts[n-1]); 0 / T- = default font-0.
;   - font size is in POINTS: px = round(size * 96/72).
;   - ";N" after the font name = vertical pixel offset, positive shifts DOWN.

include-file = ./colors.ini
include-file = ./modules.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 36
radius = 0
fixed-center = true
bottom = true
override-redirect = false

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0

padding-left = 14px
padding-right = 14px
module-margin-left = 8px
module-margin-right = 8px

; font-0 values text   : Iosevka bold 14px, digit pitch 7, cap h10 (theme 4)
; font-1 module icons  : Symbols 16px  (cpu/mem/vol/power/keyboard + music buttons)
; font-2 small icons   : Symbols Mono 13.3px (workspace icons + disk)
; font-3 mid icons     : Symbols 15px (menu + clock glyph)
; font-4 clock text    : Iosevka bold 16px, pitch 8 (theme 4)
; font-5 music note    : Iosevka regular 17px (md-music_note U+F0387, 9x13 = theme 4)
font-0 = "Iosevka Nerd Font:bold:size=10.5;3"
font-1 = "Symbols Nerd Font:size=12;3"
font-2 = "Symbols Nerd Font Mono:size=10;3"
font-3 = "Symbols Nerd Font:size=11;3"
font-4 = "Iosevka Nerd Font:bold:size=12;4"
font-5 = "Iosevka Nerd Font:size=11.25;3"

modules-left = menu dot i3 dot cpu dot memory dot filesystem
modules-center = music
modules-right = volume dot clock dot keyboard dot power dot tray

scroll-up = "#i3.next"
scroll-down = "#i3.prev"

enable-ipc = true
wm-restack = i3

[bar/aux]
monitor = ${env:MONITOR:}
width = 100%
height = 36
radius = 0
fixed-center = true
bottom = true
override-redirect = false

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0

padding-left = 14px
padding-right = 14px
module-margin-left = 8px
module-margin-right = 8px

font-0 = "Iosevka Nerd Font:bold:size=10.5;3"
font-1 = "Symbols Nerd Font:size=12;3"
font-2 = "Symbols Nerd Font Mono:size=10;3"
font-3 = "Symbols Nerd Font:size=11;3"
font-4 = "Iosevka Nerd Font:bold:size=12;4"
font-5 = "Iosevka Nerd Font:size=11.25;3"

modules-left = menu dot i3 dot cpu dot memory dot filesystem
modules-center = music
modules-right = volume dot clock dot keyboard dot power

scroll-up = "#i3.next"
scroll-down = "#i3.prev"

enable-ipc = true
wm-restack = i3
