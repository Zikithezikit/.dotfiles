;; Archcraft i3wm Premium Theme 4 modules
;; Icon codepoints verified against the reference screenshot.
;; All spacing keys use px suffix (bare numbers would be SPACES in polybar!).
;; *-font keys are 1-based: 1=font-0(text 14px), 2=font-1(Icons 16px),
;;                          3=font-2(small 13.3px), 4=font-3(mid 15px),
;;                          5=font-4(clock 16px), 6=font-5(note 14.67px)

[module/menu]
type = custom/text
format = 
format-font = 4
format-foreground = ${colors.primary}
format-padding = 0px
click-left = ~/.config/polybar/scripts/launcher.sh

[module/dot]
type = custom/text
format = ·
format-font = 1
format-foreground = ${colors.dot}
format-padding = 0px

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state><label-mode>

label-mode = %mode%
label-mode-padding = 1px
label-mode-background = ${colors.primary}
label-mode-foreground = ${colors.background}

ws-icon-0 = 1:;
ws-icon-1 = 2:;
ws-icon-2 = 3:;
ws-icon-3 = 4:;
ws-icon-4 = 5:;
ws-icon-5 = 6:;
ws-icon-6 = 7:;
ws-icon-7 = 8:;
ws-icon-8 = 9:;
ws-icon-9 = 10:;
ws-icon-default = 

label-focused = %icon%
label-focused-font = 3
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 6px

label-unfocused = %icon%
label-unfocused-font = 3
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 6px

label-visible = %icon%
label-visible-font = 3
label-visible-foreground = ${colors.muted}
label-visible-padding = 6px

label-urgent = %icon%
label-urgent-font = 3
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 6px

label-empty = %icon%
label-empty-font = 3
label-empty-foreground = ${colors.muted}
label-empty-padding = 6px

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = 󰝫
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = " %percentage%%"
label-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = 󰙭
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label = " %mb_used%"
label-foreground = ${colors.muted}

[module/filesystem]
type = custom/script
exec = ~/.config/polybar/scripts/fs.sh
interval = 30
format = <label>
format-prefix = 
format-prefix-font = 3
format-prefix-foreground = ${colors.primary}
label = " %output%"
label-foreground = ${colors.muted}

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
; music.sh is a long-running animation loop: it streams one frame per line
tail = true
format = <label>
format-foreground = ${colors.primary}
label = %output%

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-prefix = 
format-volume-prefix-font = 4
format-volume-prefix-foreground = ${colors.primary}
label-volume = " %percentage%%"
label-volume-foreground = ${colors.muted}
format-muted = <label-muted>
label-muted = " MUTE"
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/keyboard]
type = internal/xkeyboard
format = <label-layout>
format-prefix = 
format-prefix-font = 2
format-prefix-foreground = ${colors.primary}
label-layout = " %layout%"
label-layout-foreground = ${colors.muted}

[module/clock]
type = internal/date
interval = 5
time = %I:%M %p
format = <label>
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.primary}
label = " %time%"
label-font = 5
label-foreground = ${colors.muted}

[module/power]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.primary}
format-padding = 0px
click-left = ~/.config/polybar/scripts/powermenu.sh

[module/tray]
type = internal/tray
tray-size = 16
tray-padding = 2
tray-spacing = 6
