# i3blocks configuration (Archcraft i3wm Premium - Theme 4)

[now_playing]
command=playerctl metadata --format '{{status}}|{{artist}}|{{title}}' 2>/dev/null | awk -F'|' '$1=="Playing"||$1=="Paused" {printf "  %s - %s", $2, $3}'
interval=5
signal=11
separator_block_width=20

[cpu_usage]
command=/usr/share/i3blocks/cpu_usage
label=
interval=2
separator_block_width=20

[memory]
command=/usr/share/i3blocks/memory
label=
interval=30
separator_block_width=20

[disk]
command=/usr/share/i3blocks/disk 5
instance=/
label=
interval=30
separator_block_width=20

[volume]
command=/usr/share/i3blocks/volume
label=
interval=1
signal=10
separator_block_width=20

[keyboard_layout]
command=~/.config/i3blocks/keyboard_layout
label=🖮
interval=1
separator_block_width=20

[wifi_name]
command=s=$(nmcli -t -f active,ssid dev wifi | grep '^yes:' | cut -d: -f2); [ -n "$s" ] && printf '   %s' "$s"
interval=30
separator_block_width=20

[time]
command=date +"%H:%M"
label=
color=#ffcc66
interval=1
separator_block_width=20

[date]
command=date +"%a, %d %b %Y"
label=
interval=60
separator_block_width=20
