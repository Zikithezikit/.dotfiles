; gammastep - stowed at ~/.config/gammastep/config.ini
;
; The schedule is fixed (not solar), so dawn-time/dusk-time are used instead of
; the sun's elevation. gammastep requires the four values to be ordered
; dawn.start <= dawn.end <= dusk.start <= dusk.end, all within the same day, and
; an equal start/end is what makes the switch instantaneous:
;   05:00 -> daytime, 16:00 -> night.
; Because the times are fixed, gammastep never queries a location provider, so
; no [manual] section is needed.
[general]
temp-day=6500
temp-night=2500

; Gradual change over a couple of seconds instead of a hard jump.
fade=1

dawn-time=05:00-05:00
dusk-time=16:00-16:00

; i3 runs on X11, so gamma is set through the X RANDR extension. No [randr]
; section means every screen is adjusted (both monitors here).
adjustment-method=randr
